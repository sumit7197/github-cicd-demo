name: CI and SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-scan:
    name: Test and SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check HTML file exists
        run: test -f index.html

      - name: Check HTML content
        run: grep -q "Welcome to My CI/CD Project!" index.html

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: CI successful
        run: echo "Tests and SonarQube scan completed!"
